<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Poll App home">
      <img class="brand-logo brand-logo-orange" src="images/pollapp_orange.png" alt="Poll App">
      <img class="brand-logo brand-logo-dark" src="images/pollapp_dark.png" alt="Poll App">
    </a>

    <nav aria-label="Primary navigation">
      <a
        class="home-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      <button type="button" class="new-survey-button" (click)="createDialog.open()">
        New Survey
      </button>
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>
</div>

<app-create-poll-dialog />
