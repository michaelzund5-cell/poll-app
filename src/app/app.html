<!--
  File: src/app/app.html
  Purpose: Root application template.
  Renders the persistent header, primary navigation, routed page outlet and footer.
-->

<header class="shell-header">
  <a class="brand" routerLink="/" aria-label="Poll Workbench home">
    <img class="brand-mark" src="favicon.svg" alt="" aria-hidden="true">
    <span>Poll Workbench</span>
  </a>
  <nav aria-label="Primary navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Browse</a>
    <a routerLink="/new" routerLinkActive="active">Create poll</a>
  </nav>
</header>
<main class="app-frame"><router-outlet /></main>
<footer>Built as a small, focused feedback workspace.</footer>
