<!--
  File: src/index.html
  Purpose: HTML host document.
  Provides the browser document Angular mounts into and defines global metadata.
-->

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <title>Poll App</title>

  <base href="/">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Create, share and evaluate lightweight team polls."
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="images/pollapp_orange.png"
  >

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <!-- Nerko One = Figma headline font -->
  <!-- Nunito = existing body font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Nerko+One&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600;1,700&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <app-root></app-root>
</body>

</html>
